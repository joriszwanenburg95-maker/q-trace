<tr><th>Final version</th><td>${P.releases.length ? esc(P.releases[P.releases.length - 1].version) + " (" + esc(P.releases[P.releases.length - 1].date) + ")" : "Not created yet"}</td></tr>
</tbody></table>
<h2>Deviations from the default rules</h2>
${dev.length ? `<table><thead><tr><th>Stage</th><th>Status</th><th>Justification</th></tr></thead><tbody>${dev.map(x => `<tr><td>${x.s.n}. ${esc(x.s.title)}</td><td>${STATUS[x.st.status]}</td><td>${x.st.justification.trim() ? nl2br(x.st.justification) : "None recorded"}</td></tr>`).join("")}</tbody></table>` : `<p>No deviations were recorded.</p>`}
<h2>Stages</h2>
${STAGES.map(stageBlock).join("")}
<h2>Item records</h2>
<p class="muted">For each item: source → versions → evidence → decisions.</p>
${P.items.length ? P.items.map(itemBlock).join("") : "<p>No items were recorded.</p>"}
<h2>Decision log</h2>
${P.decisions.length ? `<table><thead><tr><th>Date</th><th>Stage</th><th>Decision</th><th>Items</th><th>Reason</th></tr></thead><tbody>${P.decisions.map(d => `<tr><td>${esc(d.date)}</td><td>${d.stage}</td><td>${d.type === "return" ? "Return to stage " + d.returnTo : esc(DECISION_TYPES[d.type])}</td><td>${d.targets.map(t => esc(t.itemId) + " v" + t.version).join(", ") || "–"}</td><td>${esc(d.reason)}${d.weight ? " <em>Most weight:</em> " + esc(d.weight) : ""}</td></tr>`).join("")}</tbody></table>` : "<p>No decisions were recorded.</p>"}
<p class="muted" style="margin-top:2.5rem;font-size:.85em">Generated with Q-TRACE. The accompanying data file contains the same record in machine-readable form.</p>
</body></html>`;
}

function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- dialogs ---------- */
const dlg = () => $("#dlg");
let dlgSubmit = null;
function openDialog(html, onSubmit) {
  const d = dlg();
  d.innerHTML = `<form method="dialog" novalidate>${html}</form>`;
  dlgSubmit = onSubmit;
  if (d.open) d.close();
  d.showModal();
  const first = $("[autofocus]", d) || $("input:not([type=hidden]),select,textarea,button", d);
  if (first) first.focus();
}
function closeDialog() { const d = dlg(); if (d.open) d.close(); d.innerHTML = ""; dlgSubmit = null; }
function dlgError(msg) { const e = $("#dlg-err"); if (e) { e.textContent = msg; e.hidden = false; e.scrollIntoView({ block: "nearest" }); } }
const dlgButtons = (ok = "Save", cls = "primary") => `<div class="note bad" id="dlg-err" role="alert" hidden></div><div class="dlg-actions"><button type="button" class="btn" data-act="closeDialog">Cancel</button><button type="submit" class="btn ${cls}">${ok}</button></div>`;

function confirmDialog(title, text, okLabel, danger) {
  return new Promise(resolve => {
    openDialog(`<h2 id="dlg-title">${esc(title)}</h2><p>${esc(text)}</p>${dlgButtons(okLabel, danger ? "danger" : "primary")}`, () => { closeDialog(); resolve(true); return true; });
    dlg().addEventListener("close", () => resolve(false), { once: true });
  });
}

const stageSelect = (id, val, max = 8) => `<select id="${id}">${STAGES.filter(s => s.n <= max).map(s => `<option value="${s.n}" ${Number(val) === s.n ? "selected" : ""}>${s.n}. ${esc(s.title)}</option>`).join("")}</select>`;
const facetSelect = (id, val) => `<select id="${id}"><option value="">No facet</option>${P.facets.map(f => `<option value="${f.id}" ${val === f.id ? "selected" : ""}>${esc(f.name || "(unnamed facet)")}</option>`).join("")}</select>`;
function sourceFields(src) {
  src = src || { type: "" };
  return `<label for="src-type">Source</label>
    <select id="src-type" data-dlg-change="source"><option value="">Choose…</option>${Object.entries(SOURCE_TYPES).map(([k, v]) => `<option value="${k}" ${src.type === k ? "selected" : ""}>${v}</option>`).join("")}</select>
    <div id="src-existing" ${src.type === "existing" ? "" : "hidden"}><label for="src-scale">Name of the existing scale</label><input type="text" id="src-scale" value="${esc(src.scale)}"></div>
    <div id="src-llm" ${src.type === "llm" ? "" : "hidden"}><label for="src-model">Model</label><input type="text" id="src-model" value="${esc(src.model)}"><label for="src-prompt">Prompt</label><textarea id="src-prompt" style="min-height:3.6rem">${esc(src.prompt)}</textarea></div>
    <div id="src-detail-wrap" ${src.type === "new" || src.type === "other" ? "" : "hidden"}><label for="src-detail">Details <span class="hint">(optional for New)</span></label><input type="text" id="src-detail" value="${esc(src.detail)}"></div>`;
}
function readSource() {
  const type = $("#src-type").value;
  if (!type) return { error: "Choose the source of the item." };
  if (type === "existing") { const scale = $("#src-scale").value.trim(); if (!scale) return { error: "Give the name of the existing scale." }; return { type, scale }; }
  if (type === "llm") { const model = $("#src-model").value.trim(), prompt = $("#src-prompt").value.trim(); if (!model || !prompt) return { error: "Give both the model and the prompt for an LLM-generated item." }; return { type, model, prompt }; }
  const detail = $("#src-detail").value.trim();
  if (type === "other" && !detail) return { error: "Describe the source." };
  return { type, detail };
}
function suggestItemId() { let n = P.items.length + 1, id; do { id = "ITEM-" + String(n++).padStart(2, "0"); } while (getItem(id)); return id; }
const currentDefVersion = () => (P.definitions.length ? P.definitions[P.definitions.length - 1].version : null);

function dlgNewItem(stage) {
  openDialog(`<h2 id="dlg-title">Add an item</h2>
    <div class="grid2"><div><label for="it-id">Item ID</label><input type="text" id="it-id" value="${esc(suggestItemId())}" autocomplete="off"><div class="hint">Used in the ratings file; cannot be changed later.</div></div>
    <div><label for="it-facet">Facet</label>${facetSelect("it-facet", "")}</div></div>
    <label for="it-text">Item text</label><textarea id="it-text" autofocus></textarea>
    ${sourceFields()}
    <div class="grid2"><div><label for="it-stage">Stage in which the item was added</label>${stageSelect("it-stage", stage || 4)}</div>
    <div><label for="it-date">Date</label><input type="date" id="it-date" value="${today()}"></div></div>
    <label for="it-reason">Reason for adding <span class="hint">(optional; logs the decision “Added”)</span></label><input type="text" id="it-reason">
    ${dlgButtons("Add item")}`, () => {
    const id = $("#it-id").value.trim(), text = $("#it-text").value.trim();
    if (!id) return dlgError("Give the item an ID.");
    if (/[\s,;"]/.test(id)) return dlgError("Use an ID without spaces, commas, semicolons or quotes (e.g., ANX-01).");
    if (P.items.some(i => i.id.toLowerCase() === id.toLowerCase())) return dlgError("This ID is already in use.");
    if (!text) return dlgError("Enter the item text.");
    const src = readSource(); if (src.error) return dlgError(src.error);
    const date = $("#it-date").value || today();
    P.items.push({ id, facetId: $("#it-facet").value, source: src, versions: [{ v: 1, text, date, defVersion: currentDefVersion() }] });
    const reason = $("#it-reason").value.trim();
    if (reason) P.decisions.push({ id: uid(), type: "added", stage: Number($("#it-stage").value), date, targets: [{ itemId: id, version: 1 }], reason, weight: "", evidenceIds: [] });
    done("Item " + id + " added.");
    return true;
  });
}

function evidencePick(itemIds, checked) {
  const list = P.evidence.filter(e => itemIds.includes(e.itemId));
  if (!list.length) return `<p class="hint" style="margin:.2rem 0">No evidence recorded for the selected item(s).</p>`;
  return `<div class="picklist">${list.map(e => `<label class="check" for="pe-${e.id}"><input type="checkbox" id="pe-${e.id}" name="pick-ev" value="${e.id}" ${checked && checked.includes(e.id) ? "checked" : ""}><span><span class="mono">${esc(e.itemId)}</span> v${e.version} · ${esc(EVIDENCE_TYPES[e.type] || e.type)}: ${esc(cut(e.summary, 90))}</span></label>`).join("")}</div>`;
}

function dlgEditItem(id) {
  const it = getItem(id), cv = curVersion(it);
  openDialog(`<h2 id="dlg-title">Edit wording of ${esc(it.id)}</h2>
    <p class="hint">Saving creates version ${cv.v + 1}. Version ${cv.v} stays visible in the history of the item, and the change is logged as the decision “Revised”.</p>
    <div class="note"><span class="hint">Version ${cv.v}</span><br>${esc(cv.text)}</div>
    <label for="ed-text">New wording (version ${cv.v + 1})</label><textarea id="ed-text" autofocus>${esc(cv.text)}</textarea>
    <label for="ed-reason">Reason for the revision</label><textarea id="ed-reason" style="min-height:3.6rem"></textarea>
    <div class="grid2"><div><label for="ed-stage">Stage in which the decision was made</label>${stageSelect("ed-stage", lastStage())}</div>
    <div><label for="ed-date">Date</label><input type="date" id="ed-date" value="${today()}"></div></div>
    <div class="label" id="ed-ev-l">Evidence that prompted the revision</div><div role="group" aria-labelledby="ed-ev-l">${evidencePick([it.id])}</div>
    <label for="ed-weight">Evidence given most weight <span class="hint">(optional)</span></label><input type="text" id="ed-weight">
    ${dlgButtons("Save as version " + (cv.v + 1))}`, () => {
    const text = $("#ed-text").value.trim(), reason = $("#ed-reason").value.trim();
    if (!text) return dlgError("Enter the new wording.");
    if (text === cv.text) return dlgError("The wording is unchanged. Change the text, or cancel.");
    if (!reason) return dlgError("Give a short reason for the revision.");
    const date = $("#ed-date").value || today();
    it.versions.push({ v: cv.v + 1, text, date, defVersion: currentDefVersion() });
    P.decisions.push({ id: uid(), type: "revised", stage: Number($("#ed-stage").value), date, targets: [{ itemId: it.id, version: cv.v }], reason, weight: $("#ed-weight").value.trim(),
      evidenceIds: $$("[name=pick-ev]:checked", dlg()).map(x => x.value), resultVersion: cv.v + 1 });
    done(it.id + " is now at version " + (cv.v + 1) + ".");
    return true;
  });
}

function dlgEditItemMeta(id) {
  const it = getItem(id);
  openDialog(`<h2 id="dlg-title">Facet and source of ${esc(it.id)}</h2>
    <p class="hint">Changing the facet or correcting the source does not create a new version; only a change of wording does.</p>
    <label for="it-facet">Facet</label>${facetSelect("it-facet", it.facetId)}
    ${sourceFields(it.source)}
    ${dlgButtons()}`, () => {
    const src = readSource(); if (src.error) return dlgError(src.error);
    it.facetId = $("#it-facet").value; it.source = src;
    done("Saved.");
    return true;
  });
}

function lastStage() { return route.view === "stage" ? route.n : 8; }

function dlgNewEvidence(itemId, type) {
  if (!P.items.length) return toast("Add an item first.");
  type = type || "interview";
  const it0 = itemId ? getItem(itemId) : P.items[0];
  const versionOpts = it => it.versions.map(v => `<option value="${v.v}" ${v.v === curVersion(it).v ? "selected" : ""}>Version ${v.v}: ${esc(cut(v.text, 60))}</option>`).join("");
  openDialog(`<h2 id="dlg-title">Add evidence</h2>
    <label for="ev-item">Item</label><select id="ev-item" data-dlg-change="evItem">${P.items.map(i => `<option value="${esc(i.id)}" ${i.id === it0.id ? "selected" : ""}>${esc(i.id)} — ${esc(cut(curVersion(i).text, 50))}</option>`).join("")}</select>
    <label for="ev-version">Item version the evidence is about</label><select id="ev-version">${versionOpts(it0)}</select>
    <div class="grid2"><div><label for="ev-type">Kind of evidence</label><select id="ev-type" data-dlg-change="evType">${Object.entries(EVIDENCE_TYPES).map(([k, v]) => `<option value="${k}" ${k === type ? "selected" : ""}>${v}</option>`).join("")}</select></div>
    <div><label for="ev-stage">Stage</label>${stageSelect("ev-stage", EVIDENCE_STAGE[type])}</div></div>
    <div id="ev-expected-wrap" ${type === "overlap" ? "" : "hidden"}><label for="ev-expected">Was the overlap expected?</label><select id="ev-expected"><option value="">Not recorded</option><option value="yes">Yes, expected</option><option value="no">No, not expected</option><option value="unclear">Unclear</option></select></div>
    <label for="ev-summary">Summary</label><textarea id="ev-summary" autofocus placeholder="A coded summary, never a transcript."></textarea>
    <p class="hint" id="ev-hint">${type === "expert" ? "For relevance ratings of a whole panel, use the CSV upload in Stage 6; it calculates the I-CVI and links it to the item version." : ""}</p>
    <label for="ev-date">Date</label><input type="date" id="ev-date" value="${today()}">
    ${dlgButtons("Add evidence")}`, () => {
    const summary = $("#ev-summary").value.trim();
    if (!summary) return dlgError("Enter a short summary of the evidence.");
    const e = { id: uid(), itemId: $("#ev-item").value, version: Number($("#ev-version").value), type: $("#ev-type").value, stage: Number($("#ev-stage").value), date: $("#ev-date").value || today(), summary };
    if (e.type === "overlap") e.expected = $("#ev-expected").value;
    P.evidence.push(e);
    done("Evidence linked to " + e.itemId + " version " + e.version + ".");
    return true;
  });
}

function dlgNewDecision(opts) {
  opts = opts || {};
  const isReturn = opts.type === "return";
  if (!P.items.length && !isReturn) return toast("Add an item first.");
  const stage = opts.stage || lastStage();
  const pre = opts.itemId ? [opts.itemId] : [];
  const groups = P.facets.map(f => ({ name: f.name || "(unnamed facet)", items: P.items.filter(i => i.facetId === f.id) })).concat([{ name: "No facet", items: P.items.filter(i => !P.facets.some(f => f.id === i.facetId)) }]).filter(g => g.items.length);
  openDialog(`<h2 id="dlg-title">${isReturn ? "Record a return to an earlier stage" : "Record a decision"}</h2>
    <div class="grid2"><div><label for="dc-type">Decision</label><select id="dc-type" data-dlg-change="decType">${Object.entries(DECISION_TYPES).map(([k, v]) => `<option value="${k}" ${k === (opts.type || "retained") ? "selected" : ""}>${v}</option>`).join("")}</select></div>
    <div><label for="dc-stage">Stage in which the decision was made</label>${stageSelect("dc-stage", stage)}</div></div>
    <div id="dc-return-wrap" ${isReturn ? "" : "hidden"}><label for="dc-return">Return to stage</label>${stageSelect("dc-return", Math.max(1, stage - 1), 7)}</div>
    <fieldset style="margin-top:.8rem"><legend>Items the decision applies to <span class="hint" id="dc-items-hint">${isReturn ? "(optional for a return)" : "(one or more)"}</span></legend>
      <div class="picklist" id="dc-items">${groups.map((g, gi) => `<div style="margin:.3rem 0"><strong style="font-size:.85rem">${esc(g.name)}</strong> <button type="button" class="btn link" data-act="pickGroup" data-g="${gi}" style="font-size:.82rem">select all</button>
        ${g.items.map(i => `<label class="check" for="pi-${esc(i.id)}"><input type="checkbox" id="pi-${esc(i.id)}" name="pick-item" data-g="${gi}" value="${esc(i.id)}" ${pre.includes(i.id) ? "checked" : ""} data-dlg-change="decItems"><span><span class="mono">${esc(i.id)}</span> v${curVersion(i).v} · ${esc(cut(curVersion(i).text, 70))}</span></label>`).join("")}</div>`).join("") || `<p class="hint">No items yet.</p>`}</div>
    </fieldset>
    <div id="dc-merge-wrap" hidden><label for="dc-merge">Merged into</label><select id="dc-merge"><option value="">Choose the item that remains…</option>${P.items.map(i => `<option value="${esc(i.id)}">${esc(i.id)} — ${esc(cut(curVersion(i).text, 50))}</option>`).join("")}</select></div>
    <label for="dc-reason">Reason</label><textarea id="dc-reason" style="min-height:3.6rem" ${pre.length || isReturn ? "autofocus" : ""}></textarea>
    <div class="label" id="dc-ev-l">Evidence the decision is based on</div><div role="group" aria-labelledby="dc-ev-l" id="dc-ev">${evidencePick(pre)}</div>
    <label for="dc-weight">Evidence given most weight, and why <span class="hint">(optional)</span></label><input type="text" id="dc-weight">
    <label for="dc-date">Date</label><input type="date" id="dc-date" value="${today()}">
    <p class="hint">A decision applies to the current version of each selected item. To change the wording of an item, use “Edit wording” on the item page: that creates a new version and logs the revision.</p>
    ${dlgButtons("Record decision")}`, () => {
    const type = $("#dc-type").value, st = Number($("#dc-stage").value), reason = $("#dc-reason").value.trim();
    const ids = $$("[name=pick-item]:checked", dlg()).map(x => x.value);
    if (type !== "return" && !ids.length) return dlgError("Select at least one item.");
    if (!reason) return dlgError("Give a short reason for the decision.");
    const d = { id: uid(), type, stage: st, date: $("#dc-date").value || today(), targets: ids.map(i => ({ itemId: i, version: curVersion(getItem(i)).v })), reason, weight: $("#dc-weight").value.trim(),
      evidenceIds: $$("[name=pick-ev]:checked", dlg()).map(x => x.value) };
    if (type === "return") { d.returnTo = Number($("#dc-return").value); if (d.returnTo >= st) return dlgError("Choose an earlier stage to return to than the stage in which the decision was made."); }
    if (type === "merged") { const mi = $("#dc-merge").value; if (!mi) return dlgError("Choose the item that the selected item(s) are merged into."); if (ids.includes(mi)) return dlgError("The item that remains cannot be one of the merged items."); d.mergedInto = mi; }
    P.decisions.push(d);
    done(type === "return" ? "Return to stage " + d.returnTo + " recorded." : "Decision recorded for " + ids.length + " item" + (ids.length === 1 ? "" : "s") + ".");
    return true;
  });
}

function dlgSaveDefinition() {
  const last = P.definitions[P.definitions.length - 1];
  const v = last ? last.version + 1 : 1;
  openDialog(`<h2 id="dlg-title">Save construct definition as version ${v}</h2>
    <p class="hint">${last ? "Version " + last.version + " stays in the record. Items written from now on are linked to version " + v + "." : "This is the reference point for later decisions."}</p>
    <label for="df-reason">${last ? "Reason for the change" : "Note"} ${last ? "" : `<span class="hint">(optional)</span>`}</label><textarea id="df-reason" autofocus style="min-height:3.6rem"></textarea>
    <label for="df-date">Date</label><input type="date" id="df-date" value="${today()}">
    ${dlgButtons("Save version " + v)}`, () => {
    const reason = $("#df-reason").value.trim();
    if (last && !reason) return dlgError("Give a short reason for the change.");
    const d = P.definitionDraft;
    P.definitions.push({ version: v, date: $("#df-date").value || today(), reason, definition: d.definition.trim(), excludes: d.excludes.trim(), relations: d.relations.trim(), timeframe: d.timeframe.trim(), facets: P.facets.map(f => f.name).filter(Boolean) });
    done("Construct definition saved as version " + v + ".");
    return true;
  });
}

function dlgCreateRelease() {
  const noDecision = P.items.filter(i => !itemStatus(i.id));
  const noReason = P.items.filter(i => { const d = itemStatus(i.id); return d && !d.reason.trim(); });
  const unjust = STAGES.filter(s => { const st = P.stages[s.n]; return (st.status === "deviation" || st.status === "na") && !st.justification.trim(); });
  const included = P.items.filter(i => { const d = itemStatus(i.id); return !d || (d.type !== "removed" && d.type !== "merged"); });
  const version = (P.releases.length + 1) + ".0";
  const warn = [];
  if (noDecision.length) warn.push(`${noDecision.length} item${noDecision.length === 1 ? " has" : "s have"} no final status: ${noDecision.map(i => i.id).join(", ")}.`);
  if (noReason.length) warn.push(`${noReason.length} decision${noReason.length === 1 ? " has" : "s have"} no reason.`);
  if (unjust.length) warn.push(`Stage ${unjust.map(s => s.n).join(", ")}: deviation or not applicable without a justification.`);
  if (!P.items.length) return toast("There are no items yet.");
  openDialog(`<h2 id="dlg-title">Create final version ${version}</h2>
    <p>${included.length} of ${P.items.length} items are included (items that are removed or merged are left out).</p>
    ${warn.length ? `<div class="note warn"><strong>Before release.</strong> A version is normally released only when every item has a final status with a justification and every deviation is justified.<ul>${warn.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : `<div class="note ok">Every item has a final status with a reason, and every deviation is justified.</div>`}
    <label for="rl-version">Version number</label><input type="text" id="rl-version" value="${version}">
    <label for="rl-note">Note <span class="hint">(optional)</span></label><input type="text" id="rl-note" placeholder="E.g., ready for pilot testing">
    <label for="rl-date">Date</label><input type="date" id="rl-date" value="${today()}">
    ${dlgButtons(warn.length ? "Create anyway" : "Create final version")}`, () => {
    const ver = $("#rl-version").value.trim();
    if (!ver) return dlgError("Give the version a number.");
    if (P.releases.some(r => r.version === ver)) return dlgError("This version number already exists.");
    P.releases.push({ version: ver, date: $("#rl-date").value || today(), note: $("#rl-note").value.trim(),
      items: included.map(i => ({ itemId: i.id, v: curVersion(i).v, text: curVersion(i).text, facet: facetName(i.facetId) })) });
    done("Final version " + ver + " created. Export the report and the data file to share it with its development record.");
    return true;
  });
}

function done(msg) { saveNow(); closeDialog(); render(); toast(msg); }

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
}

/* ---------- actions ---------- */
async function replaceProject(next, hash, msg) {
  if (P) {
    const ok = await confirmDialog("Replace the current project?", `“${P.meta.name || "Untitled project"}” is stored in this browser. It will be replaced. Export the data file first if you want to keep it.`, "Replace", true);
    if (!ok) return;
  }
  P = next; saveNow(); go(hash); if (msg) toast(msg);
}

const actions = {
  newProject: () => replaceProject(newProject(), "#/project", "New project created."),
  loadExample: () => replaceProject(exampleProject(), "#/project", "Example project loaded."),
  openFile: () => { const f = $("#import-file"); if (f) { f.value = ""; f.click(); } },
  closeDialog: () => closeDialog(),
  addMeasure: () => { P.similarMeasures.push({ id: uid(), name: "", limitation: "" }); saveNow(); render(); const l = P.similarMeasures[P.similarMeasures.length - 1]; const el = $("#sm-n-" + l.id); if (el) el.focus(); },
  delMeasure: el => { P.similarMeasures.splice(Number(el.dataset.i), 1); saveNow(); render(); },
  addFacet: () => { P.facets.push({ id: uid(), name: "", intended: "" }); saveNow(); render(); const l = P.facets[P.facets.length - 1]; const el = $("#fc-n-" + l.id); if (el) el.focus(); },
  delFacet: el => {
    const f = P.facets[Number(el.dataset.i)];
    if (P.items.some(i => i.facetId === f.id)) return toast("This facet still has items. Move them to another facet first.");
    P.facets.splice(Number(el.dataset.i), 1);
    P.population.themes.forEach(t => { if (t.facetId === f.id) t.facetId = ""; });
    saveNow(); render();
  },
  addTheme: () => { P.population.themes.push({ id: uid(), theme: "", facetId: "", reason: "" }); saveNow(); render(); const l = P.population.themes[P.population.themes.length - 1]; const el = $("#th-t-" + l.id); if (el) el.focus(); },
  delTheme: el => { P.population.themes.splice(Number(el.dataset.i), 1); saveNow(); render(); },
  saveDefinition: () => dlgSaveDefinition(),
  newItem: el => dlgNewItem(el.dataset.stage ? Number(el.dataset.stage) : null),
  editItem: el => dlgEditItem(el.dataset.id),
  editItemMeta: el => dlgEditItemMeta(el.dataset.id),
  delItem: async el => {
    const id = el.dataset.id;
    if (!(await confirmDialog("Delete " + id + " from the record?", "The item, its versions, and its evidence are deleted, and it is taken out of all decisions. This cannot be undone. To drop an item from the questionnaire, record the decision “Removed” instead.", "Delete", true))) return;
    const evIds = P.evidence.filter(e => e.itemId === id).map(e => e.id);
    P.items = P.items.filter(i => i.id !== id);
    P.evidence = P.evidence.filter(e => e.itemId !== id);
    P.decisions.forEach(d => { d.targets = d.targets.filter(t => t.itemId !== id); d.evidenceIds = (d.evidenceIds || []).filter(x => !evIds.includes(x)); });
    P.decisions = P.decisions.filter(d => d.targets.length || d.type === "return");
    saveNow(); go("#/items"); toast("Item " + id + " deleted.");
  },
  newEvidence: el => dlgNewEvidence(el.dataset.id, el.dataset.type),
  delEvidence: async el => {
    if (!(await confirmDialog("Remove this evidence?", "The entry is removed from the record. This cannot be undone.", "Remove", true))) return;
    const id = el.dataset.id;
    P.evidence = P.evidence.filter(e => e.id !== id);
    P.decisions.forEach(d => { d.evidenceIds = (d.evidenceIds || []).filter(x => x !== id); });
    saveNow(); render(); toast("Evidence removed.");
  },
  newDecision: el => dlgNewDecision({ itemId: el.dataset.id, stage: el.dataset.stage ? Number(el.dataset.stage) : null }),
  returnFrom: el => dlgNewDecision({ type: "return", stage: Number(el.dataset.stage) }),
  delDecision: async el => {
    if (!(await confirmDialog("Remove this decision?", "The decision is removed from the record. Item versions stay as they are. This cannot be undone.", "Remove", true))) return;
    P.decisions = P.decisions.filter(d => d.id !== el.dataset.id); saveNow(); render(); toast("Decision removed.");
  },
  pickGroup: el => { $$(`[name=pick-item][data-g="${el.dataset.g}"]`, dlg()).forEach(c => { c.checked = true; }); dlgChange.decItems(); },
  pickCsv: () => { const f = $("#csv-file"); if (f) { f.value = ""; f.click(); } },
  downloadExampleCsv: () => download("example-expert-ratings.csv", EXAMPLE_CSV, "text/csv;charset=utf-8"),
  delUpload: async el => {
    if (!(await confirmDialog("Remove this upload?", "The ratings and the I-CVI evidence that was linked to the item versions are removed.", "Remove", true))) return;
    removeCviUpload(el.dataset.id); saveNow(); render(); toast("Upload removed.");
  },
  createRelease: () => dlgCreateRelease(),
  exportReport: () => { download("q-trace-report-" + slug(P.meta.name) + ".html", buildReport(), "text/html;charset=utf-8"); toast("Report exported."); },
  printReport: () => {
    const url = URL.createObjectURL(new Blob([buildReport()], { type: "text/html;charset=utf-8" }));
    const w = window.open(url, "_blank");
    if (!w) toast("The browser blocked the new tab. Use “Export report” and open the file instead.");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  },
  exportData: () => {
    saveNow();
    download("q-trace-" + slug(P.meta.name) + "-" + today() + ".json", JSON.stringify({ format: FORMAT, version: FORMAT_VERSION, exportedAt: new Date().toISOString(), project: P }, null, 2), "application/json");
    toast("Data file exported. Archive it in an open repository.");
  },
  clearProject: async () => {
    if (!(await confirmDialog("Remove the project from this browser?", "The project is deleted from this browser. Without an exported data file it cannot be recovered.", "Remove", true))) return;
    P = null; try { localStorage.removeItem(STORE_KEY); } catch (e) {} go("#/"); toast("Project removed from this browser.");
  }
};

/* changes inside dialogs that show or hide fields */
const dlgChange = {
  source: () => { const t = $("#src-type").value; $("#src-existing").hidden = t !== "existing"; $("#src-llm").hidden = t !== "llm"; $("#src-detail-wrap").hidden = !(t === "new" || t === "other"); },
  evItem: () => { const it = getItem($("#ev-item").value); $("#ev-version").innerHTML = it.versions.map(v => `<option value="${v.v}" ${v.v === curVersion(it).v ? "selected" : ""}>Version ${v.v}: ${esc(cut(v.text, 60))}</option>`).join(""); },
  evType: () => { const t = $("#ev-type").value; $("#ev-expected-wrap").hidden = t !== "overlap"; $("#ev-stage").value = EVIDENCE_STAGE[t]; $("#ev-hint").textContent = t === "expert" ? "For relevance ratings of a whole panel, use the CSV upload in Stage 6; it calculates the I-CVI and links it to the item version." : ""; },
  decType: () => { const t = $("#dc-type").value; $("#dc-return-wrap").hidden = t !== "return"; $("#dc-merge-wrap").hidden = t !== "merged"; $("#dc-items-hint").textContent = t === "return" ? "(optional for a return)" : "(one or more)"; },
  decItems: () => { const keep = $$("[name=pick-ev]:checked", dlg()).map(x => x.value); $("#dc-ev").innerHTML = evidencePick($$("[name=pick-item]:checked", dlg()).map(x => x.value), keep); }
};

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { ev.preventDefault(); fn(el); }
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if (!P || !el.dataset || !el.dataset.bind || el.type === "checkbox" || el.type === "radio" || el.tagName === "SELECT") return;
  setPath(P, el.dataset.bind, el.dataset.num !== undefined ? (el.value === "" ? "" : Math.max(0, Math.round(Number(el.value) || 0))) : el.value);
  const s = $("#saved"); if (s) s.textContent = "Saving…";
  save();
});

document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.dlgChange) { dlgChange[el.dataset.dlgChange](); return; }
  if (el.id === "import-file") return importFile(el.files[0]);
  if (el.id === "csv-file") return uploadCsv(el.files[0]);
  if (!P || !el.dataset || !el.dataset.bind) return;
  if (el.type === "checkbox") setPath(P, el.dataset.bind, el.checked);
  else if (el.type === "radio") { if (el.checked) setPath(P, el.dataset.bind, el.value); }
  else if (el.tagName === "SELECT") setPath(P, el.dataset.bind, el.value);
  saveNow();
  if (el.dataset.rr !== undefined || el.dataset.rrBlur !== undefined) render();
});

$("#dlg").addEventListener("submit", ev => {
  ev.preventDefault();
  if (dlgSubmit) dlgSubmit();
});
$("#dlg").addEventListener("click", ev => { if (ev.target === dlg()) closeDialog(); });
$("#dlg").addEventListener("close", () => { dlg().innerHTML = ""; dlgSubmit = null; });

window.addEventListener("hashchange", () => { if (dlg().open) closeDialog(); route = parseHash(); render(true); });
window.addEventListener("beforeunload", () => { clearTimeout(saveTimer); saveNow(); });

function importFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let obj;
    try { obj = JSON.parse(String(r.result)); } catch (e) { return toast("This file could not be read: it is not valid JSON."); }
    if (!obj || obj.format !== FORMAT || !obj.project || typeof obj.project !== "object") return toast("This is not a Q-TRACE data file.");
    if (Number(obj.version) > FORMAT_VERSION) return toast("This file was made with a newer version of Q-TRACE and cannot be opened here.");
    replaceProject(normalize(obj.project), "#/project", "Project imported from " + file.name + ".");
  };
  r.onerror = () => toast("The file could not be read.");
  r.readAsText(file);
}

function uploadCsv(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const res = addCviUpload(file.name, String(r.result));
    if (res.error) return toast(res.error);
    saveNow(); render();
    const linked = res.upload.results.filter(x => x.linked).length;
    toast(`${res.replaced ? "Same file uploaded again: the earlier upload was replaced. " : ""}I-CVI calculated for ${res.upload.results.length} item version${res.upload.results.length === 1 ? "" : "s"}; ${linked} linked to the item table.`);
  };
  r.onerror = () => toast("The file could not be read.");
  r.readAsText(file);
}

/* ---------- start ---------- */
load();
route = parseHash();
render();
</script>
</body>
</html>
